name: Deploy Distill Blog to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # ── Checkout ─────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Python setup ─────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      # ── R setup (optional — remove if not using R) ───────
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.3"
          use-public-rspm: true

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::rmarkdown
            any::ggplot2
            any::dplyr
            any::tidyr
            any::knitr

      # ── Quarto setup ─────────────────────────────────────
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.4.549"
          tinytex: false

      # ── Restore notebook cache ────────────────────────────
      - name: Restore Quarto cache
        uses: actions/cache@v4
        with:
          path: |
            _freeze
            .jupyter_cache
          key: quarto-${{ runner.os }}-${{ hashFiles('posts/**/*.qmd', 'posts/**/*.ipynb') }}
          restore-keys: |
            quarto-${{ runner.os }}-

      # ── Render ────────────────────────────────────────────
      - name: Render Quarto blog
        run: quarto render

      # ── Upload artifact ───────────────────────────────────
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
